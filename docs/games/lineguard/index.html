<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>라인가드 — 빛나게임</title>
  <link rel="stylesheet" href="../../css/style.css?v=BITNA1" />
  <style>
    .game-board-wrap {
      position: relative;
      width: min(100%, 720px);
      margin: 0 auto;
    }
    .game-board-wrap #game-container {
      width: 100%;
      max-width: 720px;
    }
    #game-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(8, 10, 22, 0.78);
      backdrop-filter: blur(4px);
      text-align: center;
      pointer-events: auto;
    }
    #game-overlay[hidden] { display: none !important; }
    #game-overlay h2 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    #game-overlay p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      max-width: 28ch;
    }
    #game-overlay .overlay-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }
    #game-overlay .overlay-actions button {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      min-width: 108px;
    }
    #game-overlay .overlay-actions button.primary {
      background: var(--accent);
      border-color: transparent;
    }
    .lg-hud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: min(100%, 720px);
      align-items: center;
    }
    .lg-hud .pill span { color: var(--accent3); }
    .lg-hand {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: min(100%, 720px);
      flex-wrap: wrap;
    }
    .lg-card {
      flex: 1;
      min-width: 96px;
      max-width: 160px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1.35;
      transition: filter 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
    }
    .lg-card:hover { filter: brightness(1.08); }
    .lg-card:disabled,
    .lg-card.is-disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: none;
    }
    .lg-card .cost {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.78rem;
      color: var(--accent3);
      border: 1px solid rgba(126, 240, 195, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .lg-card.front {
      border-color: rgba(108, 140, 255, 0.7);
      box-shadow: 0 0 0 1px rgba(108, 140, 255, 0.25);
    }
    .controls button.is-on {
      background: var(--accent3);
      color: #0a1a14;
      border-color: transparent;
    }
    @media (max-width: 390px) {
      .game-stage { padding: 12px 10px 20px; gap: 12px; }
      .controls button { min-width: 100px; }
      .hint { font-size: 0.8rem; }
      .topbar .title { font-size: 0.95rem; }
      .lg-card { min-width: 88px; font-size: 0.78rem; }
    }
  </style>
  <script src="https://unpkg.com/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="../../">← 로비</a>
    <div class="title">라인가드</div>
    <div class="hud">
      <button type="button" class="mute-btn" data-bitnagame-mute aria-label="소리 끄기">🔊 소리킴</button>
    </div>
  </header>
  <main class="game-stage">
    <div class="lg-hud" aria-live="polite">
      <div class="pill">엘릭서 <span id="elixir">5.0</span>/10</div>
      <div class="pill">웨이브 <span id="wave">1</span>/5</div>
      <div class="pill">기지 <span id="base-hp">100</span></div>
      <div class="pill" id="pause-pill" hidden>일시정지</div>
    </div>
    <div class="game-board-wrap">
      <div id="game-container"></div>
      <div id="game-overlay" hidden aria-hidden="true" role="dialog" aria-labelledby="overlay-title">
        <h2 id="overlay-title">웨이브 클리어!</h2>
        <p id="overlay-sub">다시 도전하세요</p>
        <div class="overlay-actions">
          <button type="button" class="primary" id="overlay-restart">다시 시작</button>
        </div>
      </div>
    </div>
    <div class="lg-hand" role="group" aria-label="영웅 손패">
      <button type="button" class="lg-card front" id="card-0" data-hero="0">
        빛방패<br /><span class="cost">비용 3</span>
      </button>
      <button type="button" class="lg-card" id="card-1" data-hero="1">
        빛창<br /><span class="cost">비용 4</span>
      </button>
      <button type="button" class="lg-card" id="card-2" data-hero="2">
        빛고리<br /><span class="cost">비용 5</span>
      </button>
    </div>
    <div class="controls">
      <button type="button" id="btn-auto" class="is-on" aria-pressed="true">자동배치 ON</button>
      <button type="button" id="btn-pause">일시정지</button>
      <button type="button" class="primary" id="btn-restart">다시 시작</button>
    </div>
    <p class="hint">오른쪽으로 다가오는 적을 막으세요. 손패를 탭해 배치하거나 자동배치를 켜세요. 엘릭서는 시간에 따라 회복됩니다.</p>
  </main>
  <script src="../../js/audio.js?v=BITNA3"></script>
  <script src="game.js?v=LINEGUARD1"></script>
</body>
</html>
