<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>빛벽돌 — 빛나게임</title>
  <link rel="stylesheet" href="../../css/style.css?v=WEEK2BRICK390" />
  <style>
    html, body.game-page { overflow-x: hidden; max-width: 100vw; }
    .game-stage { width: 100%; max-width: 100%; overflow-x: hidden; box-sizing: border-box; }
    .game-board-wrap {
      position: relative;
      width: min(100%, 360px);
      max-width: 100%;
      margin: 0 auto;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
    }
    .game-board-wrap #game-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .game-board-wrap canvas { display: block; max-width: 100%; height: auto; }
    .topbar { max-width: 100%; }
    .topbar .hud { flex-wrap: wrap; justify-content: flex-end; max-width: 55%; }
    #game-overlay {
      position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 16px;
      background: rgba(8, 10, 22, 0.88); backdrop-filter: blur(4px); text-align: center; pointer-events: auto;
    }
    #game-overlay[hidden] { display: none !important; }
    #game-overlay h2 { font-size: 1.55rem; font-weight: 800; color: #fff; }
    #game-overlay p { color: #d7dcf0; font-size: 0.92rem; line-height: 1.45; max-width: 26ch; }
    #game-overlay .overlay-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; width: 100%; max-width: 280px; }
    #game-overlay .overlay-actions button {
      background: #2a3358; color: #fff; border: 1px solid rgba(255,255,255,.22); border-radius: 12px;
      padding: 12px 16px; min-height: 48px; font-weight: 700; cursor: pointer; min-width: 108px; flex: 1 1 120px;
    }
    #game-overlay .overlay-actions button.primary { background: var(--accent); border-color: transparent; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: min(100%, 360px); position: relative; z-index: 20; }
    .controls button {
      background: #2a3358; color: #fff; border: 1px solid rgba(255,255,255,.22); border-radius: 12px;
      padding: 14px 18px; min-height: 48px; font-weight: 700; font-size: 1rem; cursor: pointer; min-width: 140px; flex: 1 1 140px;
    }
    .controls button.primary { background: var(--accent); border-color: transparent; }
    @media (max-width: 390px) {
      .game-stage { padding: 12px 10px 20px; gap: 12px; }
      .game-board-wrap { width: 100%; max-width: calc(100vw - 20px); }
      .controls { width: 100%; }
      .controls button, #game-overlay .overlay-actions button { min-width: 100%; width: 100%; flex: 1 1 100%; }
      .hint { font-size: 0.8rem; }
      .topbar .title { font-size: 0.95rem; }
      .topbar .hud { max-width: 58%; }
      .topbar .hud .pill { font-size: 0.72rem; padding: 4px 8px; }
    }
  </style>
  <script src="https://unpkg.com/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="../../">← 로비</a>
    <div class="title">빛벽돌</div>
    <div class="hud">
      <button type="button" class="mute-btn" data-bitnagame-mute aria-label="소리 끄기">🔊 소리킴</button>
      <div class="pill">점수 <span id="score">0</span></div>
      <div class="pill">목숨 <span id="lives">3</span></div>
    </div>
  </header>
  <main class="game-stage">
    <div class="game-board-wrap">
      <div id="game-container"></div>
      <div id="game-overlay" hidden aria-hidden="true" role="dialog" aria-labelledby="overlay-title">
        <h2 id="overlay-title">완료!</h2>
        <p id="overlay-sub">점수 0</p>
        <div class="overlay-actions">
          <button type="button" class="primary" id="overlay-new">새 게임</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="btn-new" type="button">새 게임</button>
    </div>
    <p class="hint">패들을 드래그하거나 ←→ 키로 움직이세요. 공을 튕겨 벽돌을 깨세요!</p>
  </main>
  <script src="../../js/audio.js?v=BITNA3"></script>
  <script src="game.js?v=WEEK2BRICK390"></script>
</body>
</html>
