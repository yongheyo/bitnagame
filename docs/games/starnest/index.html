<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>성간호 — 빛나게임</title>
  <link rel="stylesheet" href="../../css/style.css?v=STARNEST3" />
  <style>
    html, body.game-page { overflow-x: hidden; max-width: 100vw; }
    .game-stage { width: 100%; max-width: 100%; overflow-x: hidden; box-sizing: border-box; gap: 10px; }
    .game-board-wrap { position: relative; width: min(100%, 360px); max-width: 100%; margin: 0 auto; overflow: hidden; }
    .game-board-wrap #game-container { width: 100%; max-width: 100%; overflow: hidden; }
    .game-board-wrap canvas { display: block; max-width: 100%; height: auto; }
    .sn-hud { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(100%, 360px); }
    .sn-hud .pill span { color: var(--accent3, #7ef0c3); }
    .hangar, .combat-ui { width: min(100%, 360px); margin: 0 auto; }
    .hangar-actions, .panel-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
    .hangar-actions button, .panel-tabs button, .panel button, #result-overlay button {
      background: #2a3358; color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
      padding: 12px 14px; min-height: 44px; font-weight: 700; cursor: pointer;
    }
    .hangar-actions button.primary, .panel button.primary, #result-overlay button.primary {
      background: var(--accent); border-color: transparent;
    }
    .panel {
      background: rgba(22, 29, 49, 0.95); border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
      padding: 14px; margin-top: 8px;
    }
    .panel[hidden] { display: none !important; }
    .panel h3 { margin-bottom: 8px; font-size: 1rem; }
    .panel p, .panel .meta { color: #b8c0e0; font-size: 0.88rem; line-height: 1.45; margin-bottom: 8px; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .slot {
      min-height: 52px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
      display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; text-align: center; padding: 6px;
    }
    .slot.locked { opacity: 0.45; }
    .slot.empty { background: #1a2240; }
    .slot.equipped { background: rgba(126,240,195,.15); border-color: rgba(126,240,195,.45); }
    #result-overlay, #offline-overlay {
      position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 16px;
      background: rgba(8, 10, 22, 0.92); text-align: center;
    }
    #result-overlay[hidden], #offline-overlay[hidden] { display: none !important; }
    #result-overlay h2, #offline-overlay h2 { font-size: 1.35rem; font-weight: 800; color: #fff; }
    #result-overlay p, #offline-overlay p { color: #d7dcf0; font-size: 0.92rem; }
    .overlay-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
    @media (max-width: 390px) {
      .game-stage { padding: 12px 10px 20px; }
      .game-board-wrap, .hangar, .combat-ui, .sn-hud { width: 100%; max-width: calc(100vw - 20px); }
    }
  </style>
  <script src="https://unpkg.com/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="../../">← 로비</a>
    <div class="title">성간호</div>
    <div class="hud">
      <button type="button" class="mute-btn" data-bitnagame-mute aria-label="소리 끄기">🔊 소리킴</button>
    </div>
  </header>
  <main class="game-stage">
    <div class="sn-hud" aria-live="polite">
      <div class="pill">크레딧 <span id="credits">0</span></div>
      <div class="pill">웨이브 <span id="wave">1</span></div>
      <div class="pill">HP <span id="hp">100</span></div>
    </div>
    <div class="game-board-wrap">
      <div id="game-container"></div>
      <div id="result-overlay" hidden aria-hidden="true" role="dialog">
        <h2 id="result-title">결과</h2>
        <p id="result-sub"></p>
        <div class="overlay-actions">
          <button type="button" id="btn-retry">재도전</button>
          <button type="button" id="btn-prev">이전 웨이브</button>
          <button type="button" class="primary" id="btn-hangar">정비</button>
        </div>
      </div>
      <div id="offline-overlay" hidden aria-hidden="true" role="dialog">
        <h2>항해 수익</h2>
        <p>자리 비운 동안 모은 크레딧 <strong id="offline-amt">0</strong></p>
        <button type="button" class="primary" id="offline-claim">수령</button>
      </div>
    </div>

    <div id="combat-ui" class="combat-ui" hidden>
      <p class="hint">자동 전투 중 · 보스를 처치하면 클리어</p>
    </div>

    <div id="hangar" class="hangar">
      <div class="hangar-actions">
        <button type="button" class="primary" id="btn-start">웨이브 시작</button>
        <button type="button" data-panel="panel-upgrade">업그레이드</button>
        <button type="button" data-panel="panel-slots">슬롯</button>
        <button type="button" data-panel="panel-robots">로봇</button>
      </div>
      <div id="panel-upgrade" class="panel">
        <h3>기본 공격</h3>
        <p>레벨 <span id="atk-lv">1</span> · 다음 공격력 <span id="atk-next">14</span></p>
        <p class="meta">비용 ★ <span id="atk-cost">20</span></p>
        <button type="button" class="primary" id="btn-atk-up">강화</button>
      </div>
      <div id="panel-slots" class="panel" hidden>
        <h3>장착 슬롯</h3>
        <p class="meta">인벤토리: <span id="inv-turret">시작 터렛 ×1</span></p>
        <div class="slot-grid">
          <div class="slot empty" id="slot-1">1</div>
          <div class="slot locked" id="slot-2">2</div>
          <div class="slot locked" id="slot-3">3</div>
          <div class="slot locked" id="slot-4">4</div>
          <div class="slot locked" id="slot-5">5</div>
          <div class="slot locked" id="slot-6">6</div>
        </div>
        <button type="button" class="primary" id="btn-equip">슬롯1에 터렛 장착</button>
      </div>
      <div id="panel-robots" class="panel" hidden>
        <h3>작업 로봇</h3>
        <p>고용 <span id="robot-n">0</span>/5 · MVP 효과 없음</p>
        <p class="meta">비용 ★ <span id="robot-cost">30</span></p>
        <button type="button" class="primary" id="btn-robot">고용</button>
      </div>
      <p class="hint">하단 함선이 자동으로 적을 요격합니다. 웨이브를 클리어해 성장하세요.</p>
    </div>
  </main>
  <script src="../../js/audio.js?v=BITNA3"></script>
  <script src="game.js?v=STARNEST3"></script>
</body>
</html>
