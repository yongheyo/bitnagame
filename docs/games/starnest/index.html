<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>성간호 — 빛나게임</title>
  <link rel="stylesheet" href="../../css/style.css?v=STARNEST1" />
  <style>
    html, body.game-page { overflow-x: hidden; max-width: 100vw; }
    .game-stage { width: 100%; max-width: 100%; overflow-x: hidden; box-sizing: border-box; }
    .game-board-wrap {
      position: relative;
      width: min(100%, 360px);
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
      box-sizing: border-box;
    }
    .game-board-wrap #game-container {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .game-board-wrap canvas { display: block; max-width: 100%; height: auto; }
    .sn-hud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: min(100%, 360px);
    }
    .sn-hud .pill span { color: var(--accent3, #7ef0c3); }
    .sn-ups {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(100%, 360px);
    }
    .sn-ups button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: #2a3358;
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      text-align: left;
    }
    .sn-ups button:disabled { opacity: 0.45; cursor: not-allowed; }
    .sn-ups button.can-buy { border-color: rgba(126,240,195,.45); box-shadow: 0 0 0 1px rgba(126,240,195,.15); }
    .sn-ups .meta { font-size: 0.78rem; color: #b8c0e0; font-weight: 600; }
    #offline-overlay {
      position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 16px;
      background: rgba(8, 10, 22, 0.9); backdrop-filter: blur(4px); text-align: center;
    }
    #offline-overlay[hidden] { display: none !important; }
    #offline-overlay h2 { font-size: 1.35rem; font-weight: 800; color: #fff; }
    #offline-overlay p { color: #d7dcf0; font-size: 0.92rem; line-height: 1.45; }
    #offline-overlay button {
      background: var(--accent); color: #fff; border: none; border-radius: 12px;
      padding: 12px 18px; min-height: 48px; font-weight: 700; cursor: pointer; min-width: 140px;
    }
    @media (max-width: 390px) {
      .game-stage { padding: 12px 10px 20px; gap: 12px; }
      .game-board-wrap { width: 100%; max-width: calc(100vw - 20px); }
      .hint { font-size: 0.8rem; }
      .topbar .title { font-size: 0.95rem; }
    }
  </style>
  <script src="https://unpkg.com/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="../../">← 로비</a>
    <div class="title">성간호</div>
    <div class="hud">
      <button type="button" class="mute-btn" data-bitnagame-mute aria-label="소리 끄기">🔊 소리킴</button>
    </div>
  </header>
  <main class="game-stage">
    <div class="sn-hud" aria-live="polite">
      <div class="pill">별가루 <span id="dust">0</span></div>
      <div class="pill">초당 <span id="rate">1.0</span></div>
      <div class="pill">항해 <span id="dist">10</span>광년</div>
    </div>
    <div class="game-board-wrap">
      <div id="game-container"></div>
      <div id="offline-overlay" hidden aria-hidden="true" role="dialog" aria-labelledby="offline-title">
        <h2 id="offline-title">항해 수익</h2>
        <p>자리 비운 동안 모은 별가루 <strong id="offline-amt">0</strong></p>
        <button type="button" id="offline-claim">수령</button>
      </div>
    </div>
    <div class="sn-ups" role="group" aria-label="업그레이드">
      <button type="button" id="up-gather">
        <span>채집기 <span class="meta">Lv <span id="lv-gather">0</span></span></span>
        <span class="meta">★ <span id="cost-gather">12</span></span>
      </button>
      <button type="button" id="up-hull">
        <span>선체 <span class="meta">Lv <span id="lv-hull">0</span></span></span>
        <span class="meta">★ <span id="cost-hull">20</span></span>
      </button>
      <button type="button" id="up-drone">
        <span>드론 <span class="meta">Lv <span id="lv-drone">0</span></span></span>
        <span class="meta">★ <span id="cost-drone">15</span></span>
      </button>
    </div>
    <p class="hint">함선을 탭해 별가루를 모으고, 채집기·선체·드론을 강화하세요. 승리 조건 없이 계속 성장합니다.</p>
  </main>
  <script src="../../js/audio.js?v=BITNA3"></script>
  <script src="game.js?v=STARNEST1"></script>
</body>
</html>
